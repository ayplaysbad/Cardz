    <script>
      (function () {
        const ACCESS_KEY = 'scribblewars-prealpha-access';
        const ACCESS_TOKEN = 'granted::PlaysBadScribble123';
        const ADMIN_KEY = 'scribblewars-admin-access';
        const ADMIN_TOKEN = 'granted::PlaysBadAdmin321';
        const PUBLIC_KEY = 'scribblewars-public-access';
        const params = new URLSearchParams(window.location.search || '');
        const wantsAdmin = params.get('admin') === '1';

        function readStoredValue(key) {
          try {
            return sessionStorage.getItem(key) || localStorage.getItem(key);
          } catch (error) {
            return null;
          }
        }

        function hasTesterAccess() {
          return readStoredValue(ACCESS_KEY) === ACCESS_TOKEN;
        }

        function hasAdminAccess() {
          return readStoredValue(ADMIN_KEY) === ADMIN_TOKEN;
        }

        function publicAccessEnabled() {
          return readStoredValue(PUBLIC_KEY) === '1';
        }

        if (wantsAdmin && !hasAdminAccess()) {
          window.location.replace('./index.html');
          return;
        }

        if (!wantsAdmin && hasAdminAccess()) {
          window.location.replace('./game.html?admin=1');
          return;
        }

        if (!publicAccessEnabled() && !hasTesterAccess() && !hasAdminAccess()) {
          window.location.replace('./index.html');
        }
      })();
    </script>

    <script>
      window.CardzPWA = window.ScribbleWarsPWA = (function () {
        let deferredPrompt = null;

        function canRegisterServiceWorker() {
          return 'serviceWorker' in navigator
            && (window.location.protocol === 'https:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1');
        }

        window.addEventListener('beforeinstallprompt', function (event) {
          event.preventDefault();
          deferredPrompt = event;
        });

        window.addEventListener('appinstalled', function () {
          deferredPrompt = null;
        });

        async function requestInstall() {
          const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
          const isIos = /iphone|ipad|ipod/i.test(window.navigator.userAgent || '');

          if (deferredPrompt) {
            deferredPrompt.prompt();
            try {
              await deferredPrompt.userChoice;
            } catch (error) {
              console.warn('[ScribbleWarsPWA] Install prompt failed.', error);
            }
            return true;
          }

          if (isIos && !isStandalone) {
            window.alert('To install Scribble Wars on iPhone or iPad, tap Share and then Add to Home Screen.');
            return false;
          }

          if (window.location.protocol !== 'https:' && window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
            window.alert('Install requires HTTPS on mobile browsers. Serve this WebGL build over HTTPS and try again.');
            return false;
          }

          window.alert('Install is not ready yet in this browser. Try again after the page finishes loading, or use the browser menu to install/add to home screen.');
          return false;
        }

        async function registerServiceWorker() {
          if (!canRegisterServiceWorker()) {
            return;
          }

          try {
            await navigator.serviceWorker.register('./sw.js?v=20260708133414');
          } catch (error) {
            console.warn('[ScribbleWarsPWA] Service worker registration failed.', error);
          }
        }

        registerServiceWorker();

        return {
          requestInstall: requestInstall
        };
      })();
    </script>
